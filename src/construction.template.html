<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亲手作图 · 几何实验室</title><style>/*CONSTRUCTION_CSS*/</style></head><body>
<header><a href="index.html">△ 几何实验室</a><nav><a id="return-link" href="index.html">回到例题实验</a><a href="chapters.html">章节目录</a></nav></header>
<main><div class="intro"><p>作图课堂</p><h1 id="title"></h1><p id="goal"></p></div><nav id="lesson-tabs" aria-label="选择作图课"></nav>
<div class="modebar"><div role="group" aria-label="练习方式"><button id="guided" aria-pressed="true">跟着学</button><button id="independent" aria-pressed="false">换图独立画</button></div><span id="mode-note">从条件出发，一步一步画。</span><button id="restart">重新作图</button></div>
<p class="given" id="given"></p><div class="studio"><section class="drawing-area" aria-label="作图画板"><div class="tool-heading"><b>作图工具</b><span>先选工具，再点图上的点</span></div><div id="tools" class="tools" role="group" aria-label="作图工具"></div><p id="tool-help" class="tool-help">选择一种工具。所有新点都由几何关系确定。</p><svg id="canvas" viewBox="0 0 640 460" role="group" aria-label="作图画板，点可用键盘选择"></svg><div id="placement" hidden><label for="ratio">截取长度 ÷ 原线段长度</label><input id="ratio" type="text" value="1" inputmode="text" aria-describedby="ratio-help"><button id="apply-ratio">精确截取</button><small id="ratio-help">也可以在画板上点击放点；支持 1/2、√2 等表达式。</small></div><div class="point-tools"><span>也可按点名选择：</span><div id="point-buttons" role="group" aria-label="可选择的点"></div></div><div class="canvas-footer"><span>蓝色：已知条件</span><span>绿色：你的构造</span><button id="cancel-picks">取消当前选点</button></div><div id="explore" hidden><label for="vary"><span id="vary-label"></span><output id="vary-value"></output></label><input id="vary" type="range" step=".001"><div id="numeric-vary"></div><p id="observations"></p></div></section>
<section class="task-area" aria-label="当前学习任务"><div class="progress"><span id="step-count"></span><progress id="progress" value="0" max="1"></progress></div><h2 id="task-title"></h2><p id="task-detail"></p><div id="answers" class="answers"></div><p id="feedback" class="feedback" aria-live="polite" role="status"></p><div id="reason" class="reason" hidden><b>这一步为什么有用</b><p id="reason-text"></p></div><details id="paper-guide" class="paper-guide"><summary>这一步在纸上怎么画？</summary><p id="paper-guide-text"></p></details><div class="task-actions"><button id="hint">给我一点提示</button><button id="next" class="primary" hidden>理解了，继续下一步</button></div><p id="hint-text" class="hint-text" hidden></p><details class="notebook"><summary>我的作图记录 <span id="record-count"></span></summary><ol id="history"></ol></details><section id="finish" hidden><h3>把方法带走</h3><p id="summary"></p><p id="completion"></p><button id="challenge" class="primary">换一张图，自己再画一次</button><a id="experiment-link" href="index.html">回到实验，继续探究</a></section></section></div>
<aside class="tool-note">这里使用带几何约束的作图工具：你决定从哪个点出发、参考哪条线，工具准确完成中点、垂直和对称关系。练完后，请在纸上用直尺、三角板或圆规复现，并写明作图依据。</aside></main><footer>仅限非商业教学与学习 · <a href="LICENSE">禁止商用</a></footer>
